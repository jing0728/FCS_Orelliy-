<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMA 4 to FCS 1 产品对比</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f2f3f4;color:#20252a;font:15px/1.5 "Microsoft YaHei",system-ui,sans-serif}header{padding:22px max(24px,calc((100vw - 1400px)/2));background:#fff;border-bottom:1px solid #ddd}h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#626970}.app{max-width:1448px;margin:auto;padding:20px 24px}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}select,button,input{font:inherit}select,button{border:1px solid #c5cbd0;border-radius:6px;background:white;padding:8px 12px}select{min-width:290px}button{cursor:pointer}button:hover{background:#edf2f7}button:disabled{opacity:.4;cursor:default}.badge{padding:5px 12px;border-radius:20px;background:#fff;font-weight:600}.badge.diff{color:#b40000;background:#e1f0e5}.badge.missing{background:#fff2cc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #d5dadd;border-radius:10px;background:white;overflow:hidden}.card h2{margin:0;font-size:20px}.cardhead{padding:13px 18px;border-bottom:1px solid #eceff1;display:flex;justify-content:space-between;align-items:baseline;gap:12px}.type{font-size:13px;color:#69727a}.stage{height:min(61vh,680px);min-height:390px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;touch-action:none}.stage.interactive{cursor:ew-resize}.stage svg{height:100%;width:100%;display:block;transform-origin:center}.marker{fill:rgba(210,0,0,.025);stroke:#d00000;stroke-width:3;vector-effect:non-scaling-stroke}.markerText{fill:#c00000;font-weight:bold;font-size:24px;paint-order:stroke;stroke:white;stroke-width:4}.empty{position:absolute;color:#737b83;text-align:center;max-width:80%}.foot{padding:8px 18px;background:#fafbfc;color:#5b6269;font-size:13px;border-top:1px solid #eceff1}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid #eceff1}.controls input[type=range]{flex:1;min-width:150px;accent-color:#244e74}#frameCount{min-width:90px;font-variant-numeric:tabular-nums}.note{padding:16px 20px;background:white;border:1px solid #d5dadd;border-radius:8px}.note h3{margin:0 0 6px;font-size:16px}.note p{margin:5px 0}.muted{font-size:13px;color:#6a7177}.source{margin-top:12px;font-size:13px;display:flex;gap:24px;flex-wrap:wrap}.source a{color:#285b88}label{cursor:pointer}#notice{margin-top:8px;color:#736533;background:#fff9e9;border:1px solid #eee4c9;border-radius:6px;padding:9px 13px;font-size:13px}#markersKey{color:#b00000}a{color:#285b88}@media(max-width:760px){.app{padding:14px}.grid{gap:10px}.cardhead{padding:10px;display:block}.stage{height:420px;min-height:260px}.card h2{font-size:16px}header{padding:18px}.toolbar select{width:100%}.controls{gap:7px}.type{font-size:11px}}
</style></head><body><nav style="background:#173c59;padding:8px 24px;font:14px/1.5 system-ui"><a style="color:white;text-decoration:none" href="../index.html">← 返回全部对比系列</a></nav>
<header><h1>DMA 4 to FCS 1 产品对比</h1><p>选择型号，查看 FCS 与 MP 产品图片。</p></header><main class="app">
<div class="toolbar"><label for="choice">选择型号</label><select id="choice" aria-label="选择型号"></select><span id="badge" class="badge" hidden></span><label><input type="checkbox" id="marks" checked> 显示差异标注</label><button id="zoom">放大</button><button id="reset">重置</button></div>
<div class="grid"><section class="card"><div class="cardhead"><h2 id="fcsTitle"></h2><span class="type" id="fcsType">产品图片</span></div><div class="stage" id="fcsStage"><svg id="fcsSvg" viewBox="0 0 600 900" role="img" aria-label="FCS 产品图片"><image id="fcsImage" width="600" height="900"/><g id="fcsMarks"></g></svg></div><div class="foot"><button id="fcsFront" aria-label="FCS 正面">正面</button> <button id="fcsRot" aria-label="FCS 斜视">斜视</button>　<span id="fcsViewLabel">正面</span></div></section>
<section class="card"><div class="cardhead"><h2 id="mpTitle"></h2><span class="type" id="mpType"></span></div><div class="stage interactive" id="mpStage" tabindex="0" role="group" aria-label="MP 360度图片，可左右拖动或使用左右方向键"><svg id="mpSvg" viewBox="0 0 600 900" role="img" aria-label="MP 产品旋转图片"><image id="mpImage" width="600" height="900"/><g id="mpMarks"></g></svg><div id="empty" class="empty" hidden>未取得完全一致货号的旋转图片</div></div><div class="foot" id="mpFoot"></div><div class="controls" aria-label="MP 旋转控制"><button id="previous" aria-label="上一帧">← 上一帧</button><button id="play">自动旋转</button><button id="next" aria-label="下一帧">下一帧 →</button><input type="range" id="frame" min="0" max="23" value="0" aria-label="旋转角度帧"><span id="frameCount"></span></div></section></div>

<section class="note"><h3 id="resultTitle"></h3><p id="conclusion"></p><p id="markersKey"></p><div class="source" hidden><a id="oreillySource" target="_blank" rel="noopener">查看 O’Reilly 对应货号</a><a href="https://fcsautoparts.com/find-a-part/" target="_blank" rel="noopener">FCS 官方目录</a><a id="download" download>下载当前 MP 图片</a></div></section>
<div id="notice" hidden></div></main><script src="data.js"></script><script>
(()=>{'use strict';const data=window.COMPARISON_DATA,$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';let current,frame=0,fcsFrame=0,timer=null,scale=1,drag=null;
for(const r of data.records){const o=document.createElement('option');o.value=r.id;o.textContent=`FCS ${r.fcs} ↔ MP ${r.mp}`;$('choice').append(o)}
function stop(){if(timer){clearInterval(timer);timer=null}$('play').textContent='自动旋转'}
function marks(group,asset){group.replaceChildren();if(!$('marks').checked||!asset)return;current.markEnds.forEach((end,i)=>{const b=asset.boxes[end],rect=document.createElementNS(NS,'rect');for(const [k,v] of Object.entries({x:b.x*600,y:b.y*900,width:b.w*600,height:b.h*900,rx:8,class:'marker'}))rect.setAttribute(k,v);const title=document.createElementNS(NS,'title');title.textContent=current.markLabels[end];rect.append(title);group.append(rect);const t=document.createElementNS(NS,'text');t.setAttribute('x',b.x*600+5);t.setAttribute('y',b.y*900+28);t.setAttribute('class','markerText');t.textContent=String(i+1);group.append(t)})}
function draw(){$('markersKey').hidden=!$('marks').checked;const seq=current.mpFrames,asset=seq[frame];$('fcsType').textContent=current.fcsFrames.length>1?'双角度图片':'产品图片';$('fcsViewLabel').textContent=current.fcsViews?.[fcsFrame]||'产品图片';$('fcsFront').disabled=fcsFrame===0;$('fcsRot').disabled=current.fcsFrames.length<2||fcsFrame===1;$('fcsImage').setAttribute('href',current.fcsFrames[fcsFrame].src);marks($('fcsMarks'),current.fcsFrames[fcsFrame]);$('mpSvg').style.display=seq.length?'block':'none';$('empty').hidden=!!seq.length;if(asset){$('mpImage').setAttribute('href',asset.src);$('download').href=asset.src;marks($('mpMarks'),asset)}else{$('mpImage').removeAttribute('href');$('mpMarks').replaceChildren();$('download').removeAttribute('href')}$('download').hidden=!seq.length;$('frame').value=frame;$('frame').max=Math.max(seq.length-1,0);$('frameCount').textContent=seq.length?`${frame+1} / ${seq.length} 帧`:'无旋转图片';for(const id of ['previous','next','play','frame'])$(id).disabled=seq.length<2;for(const id of ['mpSvg','fcsSvg'])$(id).style.transform=`scale(${scale})`;document.body.dataset.current=current.id;document.body.dataset.frame=String(frame+1);document.body.dataset.fcsView=String(fcsFrame+1)}
function select(id){stop();current=data.records.find(r=>r.id===id)||data.records[0];frame=current.initialFrame||0;fcsFrame=0;scale=1;$('choice').value=current.id;$('fcsTitle').textContent='FCS '+current.fcs;$('mpTitle').textContent='MP '+current.mp;$('mpType').textContent=current.mpFrames.length?'360°':'暂无图片';$('mpFoot').textContent=current.mpFrames.length?'左右拖动图片，或使用下方按钮旋转。':'暂无图片。';$('badge').textContent=current.category;$('badge').className='badge '+(current.markEnds.length?'diff':!current.mpFrames.length?'missing':'');$('resultTitle').textContent='对比说明';$('conclusion').textContent=current.conclusion;$('markersKey').textContent=current.markEnds.map((e,i)=>`${i+1}：${current.markLabels[e]}`).join('　');$('oreillySource').href=current.sourceUrl;$('notice').textContent=data.fcsNotice+(current.mpFrames.length?'':` 当前 MP ${current.mp}：${current.mpStatus}。`);$('zoom').textContent='放大';draw()}
function step(n){if(!current.mpFrames.length)return;frame=(frame+n+current.mpFrames.length)%current.mpFrames.length;draw()}
$('choice').addEventListener('change',()=>{location.hash=$('choice').value});window.addEventListener('hashchange',()=>select(decodeURIComponent(location.hash.slice(1))));$('previous').onclick=()=>{stop();step(-1)};$('next').onclick=()=>{stop();step(1)};$('play').onclick=()=>{if(timer){stop();return}if(current.mpFrames.length<2)return;timer=setInterval(()=>step(1),130);$('play').textContent='暂停旋转'};$('frame').oninput=()=>{stop();frame=Number($('frame').value);draw()};$('marks').onchange=draw;$('zoom').onclick=()=>{scale=scale===1?1.6:1;$('zoom').textContent=scale===1?'放大':'缩小';draw()};$('reset').onclick=()=>select(current.id);
$('mpStage').addEventListener('pointerdown',e=>{if(!current.mpFrames.length)return;stop();drag={x:e.clientX,start:frame};$('mpStage').setPointerCapture(e.pointerId)});$('mpStage').addEventListener('pointermove',e=>{if(!drag)return;frame=((drag.start+Math.round((e.clientX-drag.x)/12))%current.mpFrames.length+current.mpFrames.length)%current.mpFrames.length;draw()});for(const type of ['pointerup','pointercancel'])$('mpStage').addEventListener(type,()=>drag=null);$('mpStage').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stop();step(e.key==='ArrowRight'?1:-1)}});$('fcsFront').onclick=()=>{fcsFrame=0;draw()};$('fcsRot').onclick=()=>{if(current.fcsFrames.length>1){fcsFrame=1;draw()}};select(decodeURIComponent(location.hash.slice(1)));
})();
</script></body></html>
